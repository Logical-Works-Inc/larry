[package]
name = "rocco-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typed command/event/effect/terminal contracts and the finite run-state model for Rocco (spec C02)."

[features]
default = ["serde"]
# Serialization of the contract types through the lgwks_std/json edge, which
# re-exports serde (with derive) — no direct serde dependency exists here.
serde = ["lgwks_std/json"]

[dependencies]
lgwks_std = { workspace = true, features = ["random", "hash"] }
thiserror = { workspace = true }

[lints]
workspace = true
