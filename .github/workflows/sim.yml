name: simulation and e2e journey
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runner by visibility (larry#116): while this repository is private every job
# runs on the self-hosted Mac (this org's hosted runners refuse to start for
# billing); once it is public every job runs on GitHub-hosted ubuntu-latest,
# which is free there, and no self-hosted machine ever serves a public
# repository, where a fork PR could run code on it. `tests/e2e_journey.rs`
# carries a `script -qec` branch for Linux (util-linux, present on
# ubuntu-latest). Hosted legs install nextest; the self-hosted leg keeps
# `cargo test` so a job never installs tools into the shared machine.

jobs:
  # The seeded simulation suites (`crates/larry-runtime/tests/sim_*.rs`) as a
  # check of their own, so a PR shows its deterministic-simulation verdict by
  # name instead of inside the whole-workspace `rust` lane.
  simulation:
    name: simulation (${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }})
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: sim-${{ github.event.repository.private && 'self-hosted' || 'hosted' }}
          cache-bin: ${{ github.event.repository.private && 'false' || 'true' }}
      - if: ${{ !github.event.repository.private }}
        uses: taiki-e/install-action@379230e3202a8992f107d2a2dca15562c37d67bf
        with:
          tool: nextest
      - if: ${{ !github.event.repository.private }}
        run: cargo nextest run --locked -p larry-runtime -E 'binary(/^sim_/)'
      - if: ${{ github.event.repository.private }}
        run: cargo test --locked -p larry-runtime --test 'sim_*'

  # The shipped `larry` binary driven through a real terminal by
  # `tests/e2e_journey.rs`: every slash command a user types, exit 0 asserted.
  e2e-journey:
    name: e2e/journey (${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }})
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: sim-${{ github.event.repository.private && 'self-hosted' || 'hosted' }}
          cache-bin: ${{ github.event.repository.private && 'false' || 'true' }}
      - if: ${{ !github.event.repository.private }}
        uses: taiki-e/install-action@379230e3202a8992f107d2a2dca15562c37d67bf
        with:
          tool: nextest
      - if: ${{ !github.event.repository.private }}
        run: cargo nextest run --locked -p larry-demo --test e2e_journey
      - if: ${{ github.event.repository.private }}
        run: cargo test --locked -p larry-demo --test e2e_journey
