name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The Rust lanes, carried over from the larry-runtime workflow, widened to
  # the merged workspace: `--workspace` now covers larry-demo and
  # larry-contracts together.
  rust:
    # Runner by visibility (larry#116, see sim.yml): the self-hosted Mac while
    # private, GitHub-hosted ubuntu-latest once public; never self-hosted on a
    # public repository.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # `--locked --all-targets` match the lane set AGENTS.md declares and
      # `.wwfd/local-ci.sh` mirrors. They were missing here, which mattered
      # only once this job could actually run: without them the job checks a
      # different thing from the standard it appears to enforce, and a green
      # check would mean less than a reader would take it to mean.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The reranker engine is feature-gated (larry#150, ADR 0013): lint the
      # binary with it on, so the gated path never rots unbuilt.
      - run: cargo clippy --locked --features rerank --bin larry-rerank -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  # The specification and governance lanes, carried over from Larry's
  # workflow. Action SHAs are pinned here because this job ran that way
  # before the merge; the rust job above keeps its tag refs for the same
  # reason. Neither convention was changed by merging the two files.
  governance:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # The same steps as governance.yml's docs-check.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      # The e2e job's cache already holds the `larry` binary's dependencies.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: sim-${{ github.event.repository.private && 'self-hosted' || 'hosted' }}
          save-if: false
      - name: Build the larry binary
        run: cargo build --locked --bin larry
      # `larry governance` replaced tools/check_governance.py (larry#53, ADR 0010);
      # its controls and the reranker's (larry#150, ADR 0013) run in the rust
      # job's workspace tests.
      - name: Check specification and governance
        run: target/debug/larry governance --report > "$RUNNER_TEMP/larry-governance.json"
      - name: Check the tracker render
        if: always()
        run: target/debug/larry tracker --check
      - name: Check whitespace
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE_SHA" HEAD
      - name: Retain structural evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: larry-governance-${{ github.sha }}
          path: ${{ runner.temp }}/larry-governance.json
          if-no-files-found: error
          retention-days: 30
