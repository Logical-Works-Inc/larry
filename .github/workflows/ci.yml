name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per workflow and ref: a second push to a pull request cancels the run
# its first push started, so the PR shows one current verdict. A push to main
# never cancels, because that run is the proof of the landed commit (larry#307).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The lint half of the old `rust` lane, split out so rustfmt and both clippy
  # calls report in parallel with the tests instead of after them (larry#307).
  lint:
    # Runner by visibility (larry#116, see sim.yml): the self-hosted Mac while
    # private, GitHub-hosted ubuntu-latest once public; never self-hosted on a
    # public repository.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Its own key, saved only from main (larry#307): a pull request restores
      # this job's warm cache and never writes what main restores.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: lint-${{ github.event.repository.private && 'self-hosted' || 'hosted' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # `--locked --all-targets` match the lane set AGENTS.md declares and
      # `.wwfd/local-ci.sh` mirrors. They were missing here, which mattered
      # only once this job could actually run: without them the job checks a
      # different thing from the standard it appears to enforce, and a green
      # check would mean less than a reader would take it to mean.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The reranker engine is feature-gated (larry#150, ADR 0013): lint the
      # binary with it on, so the gated path never rots unbuilt.
      - run: cargo clippy --locked --features rerank --bin larry-rerank -- -D warnings

  # The test half of the old `rust` lane: the workspace suite AGENTS.md
  # declares and `cargo local-ci` runs (larry#154).
  test:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      # Its own key, saved only from main (larry#307), so a cold clippy build in
      # the lint job never evicts the compiled test lane.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: test-${{ github.event.repository.private && 'self-hosted' || 'hosted' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Hosted legs install nextest; the self-hosted leg keeps `cargo test` so
      # a job never installs tools into the shared machine (see sim.yml).
      # The install is bounded and may fail; without nextest the same lane runs
      # under cargo test (PR #165: a hung download ate a whole job).
      - if: ${{ !github.event.repository.private }}
        id: nextest
        continue-on-error: true
        timeout-minutes: 3
        uses: taiki-e/install-action@379230e3202a8992f107d2a2dca15562c37d67bf
        with:
          tool: nextest
      - if: ${{ !github.event.repository.private && steps.nextest.outcome == 'success' }}
        run: cargo nextest run --workspace --locked
      - if: ${{ github.event.repository.private || steps.nextest.outcome != 'success' }}
        run: cargo test --workspace --all-targets --locked

  # The PTY journeys on macOS (larry#245, ADR 0048). sim.yml's e2e-journey runs
  # them on Linux, where commands are confined by Landlock; this leg runs the
  # Seatbelt path a Mac user lives. Hosted only: a public repository never runs
  # on the self-hosted Mac (larry#116), and while private sim.yml's self-hosted
  # leg is already a Mac.
  e2e-journey-macos:
    # mac-specific: proves the macOS confinement path, sandbox-exec (Seatbelt, ADR 0046), and the BSD `script` PTY branch of tests/support/pty.rs; neither exists on Linux, which runs Landlock instead.
    name: e2e/journey (macos-latest)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: journey-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: nextest
        continue-on-error: true
        timeout-minutes: 3
        uses: taiki-e/install-action@379230e3202a8992f107d2a2dca15562c37d67bf
        with:
          tool: nextest
      - if: ${{ steps.nextest.outcome == 'success' }}
        run: cargo nextest run --locked -p larry-demo --test e2e_journey
      - if: ${{ steps.nextest.outcome != 'success' }}
        run: cargo test --locked -p larry-demo --test e2e_journey
      # The probes print p50/p95/p99 and peak RSS; a passing test's output is
      # captured, so they run again uncaptured for the log (same build).
      - name: Print the journey probes
        run: cargo test --locked -p larry-demo --test e2e_journey -- --nocapture --test-threads 1 probe
