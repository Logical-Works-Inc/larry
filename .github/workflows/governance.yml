name: Repository governance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check specification and governance
        run: python3 tools/check_governance.py --report > "$RUNNER_TEMP/rocco-governance.json"
      - name: Exercise positive and negative controls
        if: always()
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE_SHA" HEAD
      - name: Retain structural evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rocco-governance-${{ github.sha }}
          path: ${{ runner.temp }}/rocco-governance.json
          if-no-files-found: error
          retention-days: 30
