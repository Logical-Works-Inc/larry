name: Repository governance
on:
  push:
  pull_request:
    # `edited` reruns the issue link when only the body changes.
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  # Every PR closes at least one issue through `Closes #N` in its body
  # (Director 2026-11-03, larry#103). GitHub's own link, not a regex over the
  # body, decides: `closingIssuesReferences` holds what the merge will close.
  issue-link:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Require a closing issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          closes="$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | map("#" + tostring) | join(" ")')"
          if [ -z "$closes" ]; then
            echo "::error::PR #$PR closes no issue: put 'Closes #N' in its body (larry#103)"
            exit 1
          fi
          echo "PR #$PR closes $closes"
  docs-check:
    # Runner by visibility (larry#116, see sim.yml).
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      # The e2e job's cache already holds the `larry` binary's dependencies.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: sim-${{ github.event.repository.private && 'self-hosted' || 'hosted' }}
          save-if: false
      - name: Build the larry binary
        run: cargo build --locked --bin larry
      # `larry governance` replaced tools/check_governance.py (larry#53, ADR 0010).
      - name: Check specification and governance
        run: target/debug/larry governance --report > "$RUNNER_TEMP/larry-governance.json"
      - name: Check the tracker render
        if: always()
        run: target/debug/larry tracker --check
      # The governance controls run with the workspace tests (ci.yml, rust). The
      # reranker's controls stay Python until larry#53 step 3 ports it.
      - name: Exercise reranker controls
        if: always()
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE_SHA" HEAD
      - name: Retain structural evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: larry-governance-${{ github.sha }}
          path: ${{ runner.temp }}/larry-governance.json
          if-no-files-found: error
          retention-days: 30
