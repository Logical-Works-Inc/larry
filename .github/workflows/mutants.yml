name: mutants
# Pull requests judge a diff (larry#310, ADR 0064); a push to main has none, so
# on main only the ARM64 cache is warmed for the shards (larry#404, ADR 0095).
# This file plans and runs the shards and judges nothing: mutants-verdict.yml
# judges every run on `workflow_run`, from the default branch's own build of
# `larry mutants verdict`, so a pull request that edits this file cannot pass
# itself (larry#387, ADR 0098).
# Hosted only, like the macOS journey lane in ci.yml: a public repository never
# runs on a self-hosted machine, the x64 org runners included (larry#116), and a
# lane that installs cargo-mutants must not install it into a shared machine.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per workflow and ref: a second push to a pull request cancels the run
# its first push started. A push to main never cancels (larry#307).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lists the mutants on the lines this PR changed, builds nothing, and sizes the
  # shard matrix. Zero Rust lines changed is zero shards and a passing verdict.
  plan:
    if: ${{ !github.event.repository.private && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The lane's published settings. The verdict reads these lines from the
    # default branch's copy of this file, never from the pull request's, so a PR
    # that edits them does not move its own verdict (larry#339, larry#387).
    # K: mutants per shard. A shard pays its setup, then one
    # incremental build and one run of the root package's tests per surviving
    # mutant (about 2.5 minutes measured on a cold cache), so K = 2 is the
    # ESTIMATE that ends a shard inside 5 minutes warm (ADR 0064). Past
    # 96 shards a shard holds more than K mutants. A shard of 3 ends inside its
    # 15-minute timeout: the slowest viable mutant measured 220 s (PR #342,
    # run 44578190558), and shards of 4 or more were cut at the timeout. A plan
    # past 96 x 3 fails here, by name, in minutes (ADR 0066). Each shard runs
    # once per architecture, so the matrix holds at most 2 x 96 = 192 of
    # GitHub's 256 jobs (ADR 0095).
    env:
      MUTANTS_FLOOR: 60
      MUTANTS_PER_SHARD: 2
      MUTANTS_MAX_SHARDS: 96
      MUTANTS_SHARD_CAPACITY: 3
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      # Bounded and not allowed to fail: with no cargo-mutants there is no plan,
      # and no plan is no verdict (fail closed).
      - timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants@27.1.0
      - name: List the mutants on the changed lines
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # -M: a moved file plans mutants only on the lines it changed. Without
          # rename detection, eight mod.rs moves planned 358 mutants on untouched
          # lines (ADR 0066).
          git diff --no-color --no-ext-diff -M "origin/${BASE_REF}...HEAD" -- '*.rs' > pr.diff
          cargo mutants --workspace --in-diff pr.diff --list --json --cargo-arg=--locked > list.json
          # An empty diff prints nothing, not `[]`; both mean zero mutants.
          count="$(jq -s '(.[0] // []) | length' list.json)"
          capacity=$(( MUTANTS_MAX_SHARDS * MUTANTS_SHARD_CAPACITY ))
          if [ "$count" -gt "$capacity" ]; then
            echo "::error::$count mutants on the changed lines exceed the lane's capacity of $capacity ($MUTANTS_MAX_SHARDS shards of $MUTANTS_SHARD_CAPACITY): split the pull request"
            exit 1
          fi
          # cargo-mutants hands shard k the k-th run of ceil(count / n) mutants,
          # so n is sized from that run: 266 mutants in 96 shards left shards
          # 89 to 95 empty, with no outcomes file (run 44638202506).
          per=$(( (count + MUTANTS_MAX_SHARDS - 1) / MUTANTS_MAX_SHARDS ))
          if [ "$per" -lt "$MUTANTS_PER_SHARD" ]; then
            per="$MUTANTS_PER_SHARD"
          fi
          shards=$(( (count + per - 1) / per ))
          # Every shard on both architectures: x86_64 on ubuntu-24.04 and
          # aarch64 on ubuntu-24.04-arm, each named by its rustc host triple.
          matrix="$(jq -cn --argjson n "$shards" '{include: [
            {arch: "x86_64", runner: "ubuntu-24.04", host: "x86_64-unknown-linux-gnu"},
            {arch: "aarch64", runner: "ubuntu-24.04-arm", host: "aarch64-unknown-linux-gnu"}
            | . as $a | range(0; $n) | $a + {k: ., n: $n}]}')"
          echo "mutants on the changed lines: $count in $shards shard(s) on each of 2 architectures"
          jq -sr '(.[0] // [])[] | .name' list.json
          {
            echo "count=$count"
            echo "shards=$shards"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
      # Every shard reads this one diff, so they agree on the mutants and on n.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-diff
          path: pr.diff
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      # The verdict holds every shard's outcomes to this list, mutant by mutant.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-plan
          path: list.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # One slice of the mutant list on a warm build, on one architecture. A caught
  # or missed mutant is data, not a failure: cargo-mutants exits 2 for a missed
  # one and 3 for a timeout, and the verdict owns the floor. Any other exit
  # code is a shard that did not run.
  shard:
    name: shard ${{ matrix.arch }} ${{ matrix.k }}/${{ matrix.n }}
    needs: plan
    if: ${{ needs.plan.outputs.shards != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      # A runner label that served the other architecture would judge nothing
      # this leg claims: the host triple decides, fail closed.
      - name: Check the architecture
        env:
          WANT: ${{ matrix.host }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host $host, uname $(uname -m), expected $WANT"
          if [ "$host" != "$WANT" ]; then
            echo "::error::this shard runs on $host, not $WANT: it judges the wrong architecture (fail closed)"
            exit 1
          fi
      # This workflow judges no main push, so a key of its own would never be
      # written by a judged run. x86_64 restores the test lane's key and aarch64
      # the key the warm job saves from main; both save only from main
      # (larry#307), so a pull request never writes what main restores. The
      # cache paths must equal the saver's, `cache-bin` included, or GitHub keys
      # the two caches apart: the first run with `cache-bin: false` found no
      # cache and paid a cold build (ADR 0064).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ${{ matrix.arch == 'x86_64' && 'test-hosted' || 'mutants-aarch64' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ matrix.arch == 'x86_64' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants@27.1.0,nextest@0.9.152
      # cargo-mutants publishes no aarch64 Linux binary, so this leg builds it
      # from source; the warm cache from main carries it in `~/.cargo/bin`, and
      # a cache hit makes this install a no-op. Bounded: a cold build is about
      # two minutes, and no tool is no verdict (fail closed).
      - if: ${{ matrix.arch == 'aarch64' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest@0.9.152
      - if: ${{ matrix.arch == 'aarch64' }}
        timeout-minutes: 8
        run: cargo install cargo-mutants --locked --version 27.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutants-diff
      - name: Run this shard
        env:
          SHARD_K: ${{ matrix.k }}
          SHARD_N: ${{ matrix.n }}
        run: |
          set -uo pipefail
          rc=0
          # --baseline skip: ci.yml's test lane is the baseline, run once there
          # and not on every shard. --timeout bounds a mutant that loops.
          cargo mutants --workspace --in-diff pr.diff --shard "${SHARD_K}/${SHARD_N}" \
            --in-place --baseline skip --test-tool nextest --no-shuffle \
            --timeout 300 --cargo-arg=--locked || rc=$?
          case "$rc" in
            0 | 2 | 3) echo "cargo mutants exited $rc: the outcomes are the verdict's" ;;
            *)
              echo "::error::cargo mutants exited $rc on shard ${SHARD_K}/${SHARD_N}: it did not judge its mutants"
              exit "$rc"
              ;;
          esac
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-outcomes-${{ matrix.arch }}-${{ matrix.k }}
          path: mutants.out/outcomes.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The aarch64 shards' warm build: on each push to main, the workspace tests
  # compile on ARM64 and cargo-mutants is built from source, and both are saved
  # under the key those shards restore. It judges nothing.
  warm-aarch64:
    if: ${{ !github.event.repository.private && github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: mutants-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest@0.9.152
      - timeout-minutes: 8
        run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo nextest run --workspace --locked --no-run
