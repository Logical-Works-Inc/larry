name: mutants
# Pull requests judge a diff (larry#310, ADR 0064); a push to main has none, so
# on main only the ARM64 cache is warmed for the shards (larry#404, ADR 0095).
# Hosted only, like the macOS journey lane in ci.yml: a public repository never
# runs on a self-hosted machine, the x64 org runners included (larry#116), and a
# lane that installs cargo-mutants must not install it into a shared machine.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per workflow and ref: a second push to a pull request cancels the run
# its first push started. A push to main never cancels (larry#307).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lists the mutants on the lines this PR changed, builds nothing, and sizes the
  # shard matrix. Zero Rust lines changed is zero shards and a passing verdict.
  plan:
    if: ${{ !github.event.repository.private && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The lane's published settings. The verdict reads these lines from the
    # base branch's copy of this file with `git show`, never from the pull
    # request's copy, so a PR that edits them does not move its own verdict
    # (larry#339). K: mutants per shard. A shard pays its setup, then one
    # incremental build and one run of the root package's tests per surviving
    # mutant (about 2.5 minutes measured on a cold cache), so K = 2 is the
    # ESTIMATE that ends a shard inside 5 minutes warm (ADR 0064). Past
    # 96 shards a shard holds more than K mutants. A shard of 3 ends inside its
    # 15-minute timeout: the slowest viable mutant measured 220 s (PR #342,
    # run 44578190558), and shards of 4 or more were cut at the timeout. A plan
    # past 96 x 3 fails here, by name, in minutes (ADR 0066). Each shard runs
    # once per architecture, so the matrix holds at most 2 x 96 = 192 of
    # GitHub's 256 jobs (ADR 0095).
    env:
      MUTANTS_FLOOR: 60
      MUTANTS_PER_SHARD: 2
      MUTANTS_MAX_SHARDS: 96
      MUTANTS_SHARD_CAPACITY: 3
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      # Bounded and not allowed to fail: with no cargo-mutants there is no plan,
      # and no plan is no verdict (fail closed).
      - timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants@27.1.0
      - name: List the mutants on the changed lines
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # -M: a moved file plans mutants only on the lines it changed. Without
          # rename detection, eight mod.rs moves planned 358 mutants on untouched
          # lines (ADR 0066).
          git diff --no-color --no-ext-diff -M "origin/${BASE_REF}...HEAD" -- '*.rs' > pr.diff
          cargo mutants --workspace --in-diff pr.diff --list --json --cargo-arg=--locked > list.json
          # An empty diff prints nothing, not `[]`; both mean zero mutants.
          count="$(jq -s '(.[0] // []) | length' list.json)"
          capacity=$(( MUTANTS_MAX_SHARDS * MUTANTS_SHARD_CAPACITY ))
          if [ "$count" -gt "$capacity" ]; then
            echo "::error::$count mutants on the changed lines exceed the lane's capacity of $capacity ($MUTANTS_MAX_SHARDS shards of $MUTANTS_SHARD_CAPACITY): split the pull request"
            exit 1
          fi
          # cargo-mutants hands shard k the k-th run of ceil(count / n) mutants,
          # so n is sized from that run: 266 mutants in 96 shards left shards
          # 89 to 95 empty, with no outcomes file (run 44638202506).
          per=$(( (count + MUTANTS_MAX_SHARDS - 1) / MUTANTS_MAX_SHARDS ))
          if [ "$per" -lt "$MUTANTS_PER_SHARD" ]; then
            per="$MUTANTS_PER_SHARD"
          fi
          shards=$(( (count + per - 1) / per ))
          # Every shard on both architectures: x86_64 on ubuntu-24.04 and
          # aarch64 on ubuntu-24.04-arm, each named by its rustc host triple.
          matrix="$(jq -cn --argjson n "$shards" '{include: [
            {arch: "x86_64", runner: "ubuntu-24.04", host: "x86_64-unknown-linux-gnu"},
            {arch: "aarch64", runner: "ubuntu-24.04-arm", host: "aarch64-unknown-linux-gnu"}
            | . as $a | range(0; $n) | $a + {k: ., n: $n}]}')"
          echo "mutants on the changed lines: $count in $shards shard(s) on each of 2 architectures"
          jq -sr '(.[0] // [])[] | .name' list.json
          {
            echo "count=$count"
            echo "shards=$shards"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
      # Every shard reads this one diff, so they agree on the mutants and on n.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-diff
          path: pr.diff
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # One slice of the mutant list on a warm build, on one architecture. A caught
  # or missed mutant is data, not a failure: cargo-mutants exits 2 for a missed
  # one and 3 for a timeout, and the verdict job owns the floor. Any other exit
  # code is a shard that did not run.
  shard:
    name: shard ${{ matrix.arch }} ${{ matrix.k }}/${{ matrix.n }}
    needs: plan
    if: ${{ needs.plan.outputs.shards != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      # A runner label that served the other architecture would judge nothing
      # this leg claims: the host triple decides, fail closed.
      - name: Check the architecture
        env:
          WANT: ${{ matrix.host }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host $host, uname $(uname -m), expected $WANT"
          if [ "$host" != "$WANT" ]; then
            echo "::error::this shard runs on $host, not $WANT: it judges the wrong architecture (fail closed)"
            exit 1
          fi
      # This workflow judges no main push, so a key of its own would never be
      # written by a judged run. x86_64 restores the test lane's key and aarch64
      # the key the warm job saves from main; both save only from main
      # (larry#307), so a pull request never writes what main restores. The
      # cache paths must equal the saver's, `cache-bin` included, or GitHub keys
      # the two caches apart: the first run with `cache-bin: false` found no
      # cache and paid a cold build (ADR 0064).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ${{ matrix.arch == 'x86_64' && 'test-hosted' || 'mutants-aarch64' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ matrix.arch == 'x86_64' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants@27.1.0,nextest@0.9.152
      # cargo-mutants publishes no aarch64 Linux binary, so this leg builds it
      # from source; the warm cache from main carries it in `~/.cargo/bin`, and
      # a cache hit makes this install a no-op. Bounded: a cold build is about
      # two minutes, and no tool is no verdict (fail closed).
      - if: ${{ matrix.arch == 'aarch64' }}
        timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest@0.9.152
      - if: ${{ matrix.arch == 'aarch64' }}
        timeout-minutes: 8
        run: cargo install cargo-mutants --locked --version 27.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutants-diff
      - name: Run this shard
        env:
          SHARD_K: ${{ matrix.k }}
          SHARD_N: ${{ matrix.n }}
        run: |
          set -uo pipefail
          rc=0
          # --baseline skip: ci.yml's test lane is the baseline, run once there
          # and not on every shard. --timeout bounds a mutant that loops.
          cargo mutants --workspace --in-diff pr.diff --shard "${SHARD_K}/${SHARD_N}" \
            --in-place --baseline skip --test-tool nextest --no-shuffle \
            --timeout 300 --cargo-arg=--locked || rc=$?
          case "$rc" in
            0 | 2 | 3) echo "cargo mutants exited $rc: the outcomes are the verdict's" ;;
            *)
              echo "::error::cargo mutants exited $rc on shard ${SHARD_K}/${SHARD_N}: it did not judge its mutants"
              exit "$rc"
              ;;
          esac
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-outcomes-${{ matrix.arch }}-${{ matrix.k }}
          path: mutants.out/outcomes.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The aarch64 shards' warm build: on each push to main, the workspace tests
  # compile on ARM64 and cargo-mutants is built from source, and both are saved
  # under the key those shards restore. It judges nothing.
  warm-aarch64:
    if: ${{ !github.event.repository.private && github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: mutants-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - timeout-minutes: 3
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: nextest@0.9.152
      - timeout-minutes: 8
        run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo nextest run --workspace --locked --no-run

  # The one check a worker reads. It fails closed: a plan that did not finish, a
  # shard that did not run, a missing outcomes file, a mutant with no outcome, an
  # outcome it does not know and a mutant the two architectures judge apart are
  # each a red verdict, never a pass.
  verdict:
    needs: [plan, shard]
    if: ${{ always() && !github.event.repository.private && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The floor and the caps are the base branch's, never the pull request's:
      # on a pull_request event this workflow file is the head's, so a PR would
      # otherwise lower the floor that judges it (larry#339).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Read the floor and the caps from the base ref
        id: settings
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git show "origin/${BASE_REF}:.github/workflows/mutants.yml" > base-mutants.yml
          # The base ref publishes each setting once, as `NAME: <number>`.
          setting() { sed -n "s/^ *$1: *\([0-9][0-9]*\)$/\1/p" base-mutants.yml; }
          # The base copy from before this change names the floor `FLOOR`;
          # once merged it publishes `MUTANTS_FLOOR`. Either way the number is
          # the base ref's, never the pull request's.
          floor="$(setting MUTANTS_FLOOR)"
          if [ -z "$floor" ]; then
            floor="$(setting FLOOR)"
          fi
          case "$floor" in
            '' | *[!0-9]*)
              echo "::error::the base ref's floor is not one number: there is no verdict (fail closed)"
              exit 1
              ;;
          esac
          echo "MUTANTS_FLOOR=$floor" >> "$GITHUB_OUTPUT"
          for name in MUTANTS_MAX_SHARDS MUTANTS_SHARD_CAPACITY; do
            value="$(setting "$name")"
            case "$value" in
              '' | *[!0-9]*)
                echo "::error::the base ref's $name is not one number: there is no verdict (fail closed)"
                exit 1
                ;;
            esac
            echo "${name}=$value" >> "$GITHUB_OUTPUT"
          done
      # A missing artifact is judged below by count, so a download that finds
      # nothing is not allowed to hide behind its own error here.
      - if: ${{ needs.plan.outputs.shards != '' && needs.plan.outputs.shards != '0' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutants-outcomes-*
          path: outcomes
      - name: Judge the mutants
        env:
          PLAN: ${{ needs.plan.result }}
          SHARD: ${{ needs.shard.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          FLOOR: ${{ steps.settings.outputs.MUTANTS_FLOOR }}
          MAX_SHARDS: ${{ steps.settings.outputs.MUTANTS_MAX_SHARDS }}
          SHARD_CAPACITY: ${{ steps.settings.outputs.MUTANTS_SHARD_CAPACITY }}
        run: |
          set -uo pipefail
          if [ "$PLAN" != success ] || [ -z "$SHARDS" ]; then
            echo "::error::the plan job ended '$PLAN': there is no verdict (fail closed)"
            exit 1
          fi
          if [ -z "$FLOOR" ] || [ -z "$MAX_SHARDS" ] || [ -z "$SHARD_CAPACITY" ] || [ -z "$COUNT" ]; then
            echo "::error::the base ref's floor or caps were not read: there is no verdict (fail closed)"
            exit 1
          fi
          if [ "$SHARDS" = 0 ]; then
            echo "no mutants: this PR changes no Rust line cargo-mutants can mutate"
            echo "mutants: no mutants" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bad=0
          # The base ref's capacity, not the pull request's: a plan that lists
          # more mutants than the base branch allows is refused here.
          capacity=$(( MAX_SHARDS * SHARD_CAPACITY ))
          if [ "$COUNT" -gt "$capacity" ]; then
            echo "::error::$COUNT mutants exceed the base ref's capacity of $capacity ($MAX_SHARDS shards of $SHARD_CAPACITY): split the pull request"
            bad=1
          fi
          if [ "$SHARD" != success ]; then
            echo "::error::a shard ended '$SHARD': its mutants are not judged (fail closed)"
            bad=1
          fi
          # Each architecture is judged on its own, against the same plan and floor.
          for arch in x86_64 aarch64; do
            files=()
            for f in outcomes/mutants-outcomes-"$arch"-*/outcomes.json; do
              if [ -f "$f" ]; then files+=("$f"); fi
            done
            if [ "${#files[@]}" -ne "$SHARDS" ]; then
              echo "::error::$arch: ${#files[@]} outcomes files for $SHARDS shards (fail closed)"
              exit 1
            fi
            # Baseline entries are strings; a mutant's scenario is {"Mutant": {...}}.
            jq -s '[.[] | .outcomes[]
                    | select(.scenario | type == "object" and has("Mutant"))
                    | .scenario.Mutant as $m
                    | {file: $m.file, line: $m.span.start.line, replacement: $m.replacement,
                       name: $m.name, summary: .summary}]' "${files[@]}" > "merged-$arch.json" || exit 1
            count_of() { jq --arg s "$1" '[.[] | select(.summary == $s)] | length' "merged-$arch.json"; }
            total="$(jq length "merged-$arch.json")"
            caught="$(count_of CaughtMutant)"
            missed="$(count_of MissedMutant)"
            unviable="$(count_of Unviable)"
            timeouts="$(count_of Timeout)"
            unknown=$(( total - caught - missed - unviable - timeouts ))
            viable=$(( caught + missed ))
            echo "$arch: planned $COUNT mutants, judged $total in $SHARDS shard(s)"
            echo "$arch: viable $viable = caught $caught + missed $missed"
            echo "$arch: left out of the denominator: unviable $unviable, timeout $timeouts"
            if [ "$total" -ne "$COUNT" ]; then
              echo "::error::$arch: $total mutants have an outcome but the plan listed $COUNT (fail closed)"
              bad=1
            fi
            if [ "$unknown" -ne 0 ]; then
              echo "::error::$arch: $unknown mutants have an outcome this verdict does not know (fail closed)"
              bad=1
            fi
            jq -r --arg arch "$arch" '.[] | select(.summary == "MissedMutant")
                   | "\($arch) missed \(.file):\(.line): \(.replacement)  (\(.name | sub("^.*?:[0-9]+:[0-9]+: "; "")))"' "merged-$arch.json"
            if [ "$viable" -eq 0 ]; then
              echo "$arch: no viable mutant: nothing to hold against the floor"
              echo "mutants $arch: no viable mutant, unviable $unviable, timeout $timeouts" >> "$GITHUB_STEP_SUMMARY"
            else
              tenths=$(( caught * 1000 / viable ))
              line="caught $caught of $viable viable = $(( tenths / 10 )).$(( tenths % 10 ))%, floor ${FLOOR}% (unviable $unviable and timeout $timeouts excluded)"
              echo "$arch: $line"
              echo "mutants $arch: $line" >> "$GITHUB_STEP_SUMMARY"
              if [ $(( caught * 100 )) -lt $(( FLOOR * viable )) ]; then
                echo "::error::$arch: mutation score under the ${FLOOR}% floor: $missed missed mutant(s) listed above"
                bad=1
              fi
            fi
          done
          # Parity: one diff, one plan, so each mutant has one outcome per
          # architecture. Caught on one and missed or unviable on the other is
          # a test or a build that depends on the machine; a timeout on one
          # side is load, not code, and is only reported.
          jq -s '[.[0][] | . + {arch: "x86_64"}] + [.[1][] | . + {arch: "aarch64"}]
                 | group_by([.file, .line, .replacement, .name])
                 | map({mutant: "\(.[0].file):\(.[0].line): \(.[0].replacement)",
                        outcomes: (map("\(.arch) \(.summary)") | join(", ")),
                        arches: length,
                        summaries: (map(.summary) | unique)})
                 | map(select(.arches != 2 or (.summaries | length) > 1))' \
            merged-x86_64.json merged-aarch64.json > apart.json || exit 1
          split="$(jq '[.[] | select(.arches != 2 or (.summaries | index("Timeout") | not))] | length' apart.json)"
          jq -r '.[] | "apart \(.mutant): \(.outcomes)"' apart.json
          if [ "$split" -ne 0 ]; then
            echo "::error::$split mutant(s) are judged apart by x86_64 and aarch64, listed above: an outcome depends on the machine"
            bad=1
          fi
          exit "$bad"
