# Registered dependency edges for Larry (Logical-Works-Inc/larry).
#
# Merged 2026-09-18 from the two registers that existed while the contract
# crate lived in a second repository (`srinji-kaggss/larry-runtime`, deleted
# 2026-10-26). This file is the only register. Larry carries the
# specification, the fixture surface, the contract crate and the runtime, and
# every external edge they compile against is accounted for here.
#
# The law (Director 2026-10-22, 2026-11-01, 2026-11-03): the foundation is
# Rust `std` plus the `lgwks_*` crates exact-pinned to their newest releases.
# Any reproducible, advisory-free OSS crate is allowed when its manifest line
# cites an open `gap` issue on Logical-Works-Inc/logicalworks-crates and the
# gates stay under 5 minutes; its row here names that issue and is retired
# when the estate closes the gap.
#
# The `lgwks_*` edges are deliberately absent: lgwks_std is the workspace
# stdlib+ (self-exempt) and lgwks_deps is the estate's own admission
# storefront, so `lgwks-deps check` reports them as owned without a row. The
# AppCUI edge (`lgwks_deps`/`appcui`) left with larry#239 (ADR 0045): the
# terminal frame is Larry's own on the two rows at the end of this file.
#
# `lgwks_bot` (defaults off) is an edge of larry-contracts and larry-runtime from larry#74, the
# clock and skew rows; as an `lgwks_*` crate it is estate-owned and needs no row.

[policy]
schema = 3
enforce = true
repository = "https://github.com/Logical-Works-Inc/larry"
accepted_licenses = "MIT, Apache-2.0"

# The boundary edges below are the crates this workspace compiles that the
# estate does not own. `thiserror` left with larry#339: its cited gap
# Logical-Works-Inc/logicalworks-crates#842 is closed, and every error enum takes
# Display, Error and From from the estate's lgwks_macros::Error derive (larry#435).

# The terminal frontend (larry#239, ADR 0045). crossterm was already in the
# lock under AppCUI; dropping AppCUI took the larry-demo normal tree from 250 to
# 210 unique crates (cargo tree --locked -e normal --prefix none | sort -u, on
# Oracle, 2026-11-16).
[[approved]]
crate = "crossterm"
tier = "boundary"
version = "=0.29.0"
license = "MIT"
owner = "larry-demo"
capability = "terminal-io"
source = "registry"
allowed_consumers = "larry-demo"
allowed_kinds = "normal"
reason = "raw mode, key events, bracketed paste and resize for bare `larry`; std has no termios or key decoding and no lgwks_* crate owns a terminal runtime (Drishti is GPUI). Estate gap: Logical-Works-Inc/logicalworks-crates#1067; retire this row when it closes."
approved_by = "srinji-kaggss (Director)"
approved_on = "2026-11-16"
review = "https://github.com/Logical-Works-Inc/larry/issues/239"

[[approved]]
crate = "unicode-width"
tier = "boundary"
version = "=0.2.3"
license = "MIT OR Apache-2.0"
owner = "larry-demo"
capability = "display-width"
source = "registry"
allowed_consumers = "larry-demo"
allowed_kinds = "normal"
reason = "UAX #11 display widths so the frame wraps CJK, emoji and combining marks; no dependencies; std and lgwks_std have no width table. Estate gap: Logical-Works-Inc/logicalworks-crates#1067; retire this row when it closes."
approved_by = "srinji-kaggss (Director)"
approved_on = "2026-11-16"
review = "https://github.com/Logical-Works-Inc/larry/issues/239"

[[approved]]
crate = "rustix"
tier = "boundary"
version = "=1.1.6"
license = "Apache-2.0 OR MIT"
owner = "larry-demo"
capability = "handle-relative-fs"
source = "registry"
allowed_consumers = "larry-demo"
allowed_kinds = "normal"
reason = "`openat` and `chmodat` reset a workspace directory's mode from its held descriptor; `lgwks_std::fs::capability::Dir` has no mode-reset call, and `std::fs::set_permissions` follows a link swapped in after its check (CWE-367, CWE-59; larry#366). rustix is already in the lock through `lgwks_std` `fs-raw`, so this edge adds no crate. Estate gap: Logical-Works-Inc/logicalworks-crates#1113; retire this row when it closes."
approved_by = "rust-guard GAP law (Director 2026-11-03): any reproducible, advisory-free OSS crate cited to an open gap issue"
approved_on = "2026-11-21"
review = "https://github.com/Logical-Works-Inc/logicalworks-crates/issues/1113"

# ── bevy_ecs: SUPERSEDED, NOT AN EDGE ────────────────────────────────────────
#
# The Director's 2026-09-20 direction ("work on the lowest invariant, the
# runtime, based on Bevy") and the 2026-10-26 correction that ECS drives
# everything are now served by the estate: lgwks_bot 6.1.0 is workflow
# orchestration on one ECS world. One owner per capability (province#4,
# logic-os-kernel#850) means the runtime moves onto lgwks_bot's world and
# journal instead of admitting a second ECS here. See the product plan,
# Track 1 (docs/product/README.md).
