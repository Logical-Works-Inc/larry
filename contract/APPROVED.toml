# Registered dependency edges for Larry (Logical-Works-Inc/larry).
#
# Merged 2026-09-18 from the two registers that existed while the contract
# crate lived in a second repository (`srinji-kaggss/larry-runtime`, deleted
# 2026-10-26). This file is the only register. Larry carries the
# specification, the fixture surface, the contract crate and the runtime, and
# every external edge they compile against is accounted for here.
#
# The law (Director 2026-10-22, 2026-11-01, 2026-11-03): the foundation is
# Rust `std` plus the `lgwks_*` crates exact-pinned to their newest releases.
# Any reproducible, advisory-free OSS crate is allowed when its manifest line
# cites an open `gap` issue on Logical-Works-Inc/logicalworks-crates and the
# gates stay under 5 minutes; its row here names that issue and is retired
# when the estate closes the gap.
#
# The `lgwks_*` edges are deliberately absent: lgwks_std is the workspace
# stdlib+ (self-exempt) and lgwks_deps is the estate's own admission
# storefront, so `lgwks-deps check` reports them as owned without a row. The
# AppCUI edge is `lgwks_deps`/`appcui`, not a direct appcui dependency; that
# storefront admission is recorded in `docs/architecture/visual-pass.md`. Its
# proc-macro is held at 0.3.6 in Cargo.lock until
# Logical-Works-Inc/logicalworks-crates#841 lands.
#
# `lgwks_bot` is catalogued in the workspace manifest but no member depends on
# it yet, so it is not an edge and needs no row.

[policy]
enforce = true
repository = "https://github.com/Logical-Works-Inc/larry"

# The one third-party edge in the workspace. Carried from the larry-runtime
# admission, which recorded an owner and a reason but none of the sign-off
# keys this schema requires; the sign-off below names that commit rather than
# inventing a fresh approval.
[[approved]]
crate = "thiserror"
tier = "boundary"
version = "=2.0.20"
owner = "larry-contracts"
capability = "error-derive"
source = "registry"
allowed_consumers = "larry-contracts"
allowed_kinds = "normal"
reason = "derive-backed std::error::Error implementations on the C02 contract error types, which std's own error trait cannot express without hand-written boilerplate and no lgwks_std feature exposes. Estate gap: Logical-Works-Inc/logicalworks-crates#842; retire this row when it closes."
approved_by = "srinji-kaggss (Director)"
approved_on = "2026-09-16"
review = "https://github.com/srinji-kaggss/larry-runtime/commit/53c751220ddef57c694647b7da14eb3b88eda1df"

# ── bevy_ecs: SUPERSEDED, NOT AN EDGE ────────────────────────────────────────
#
# The Director's 2026-09-20 direction ("work on the lowest invariant, the
# runtime, based on Bevy") and the 2026-10-26 correction that ECS drives
# everything are now served by the estate: lgwks_bot 6.1.0 is workflow
# orchestration on one ECS world. One owner per capability (province#4,
# logic-os-kernel#850) means the runtime moves onto lgwks_bot's world and
# journal instead of admitting a second ECS here. See the product plan,
# Track 1 (docs/product/README.md).
