[package]
name = "larry-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "larry"
description = "Larry, the always-on harness organ of Logic OS: executor, model client and MCP server"

[workspace]
# One repository, one workspace. `crates/larry-contracts` was previously the
# whole of a second repository (`srinji-kaggss/rocco-runtime`) whose manifest
# declared this same crate set; it is a member here instead. The root package
# is an implicit member.
members = ["crates/larry-contracts", "crates/larry-runtime"]
# Edition 2024 selects resolver 3; stated explicitly because the merged
# workspace previously ran under resolver 2 on the runtime side.
resolver = "3"

# Larry — the specification repository, which also carries the implementation
# and the contract crate it governs. Dependency order: Rust std, then the
# lgwks_* estate (exact-pinned crates.io releases), then Loco.rs for the web,
# ORM, jobs, mail and auth gaps the estate does not own, then any other OSS
# crate only with a cited logicalworks-crates `gap` issue. Every third-party
# edge is registered in contract/APPROVED.toml or it does not compile its way
# into this workspace.

[workspace.package]
edition = "2024"
# Hippocratic License 3.0 (HL3-FULL) plus the Licensor's Part B, in /LICENSE.
# Not an SPDX-listed license, hence the LicenseRef; publish = false everywhere.
license = "LicenseRef-Larry-HL3-FULL"
repository = "https://github.com/Logical-Works-Inc/larry"
# The real floor, and it is the library's: lgwks_std 3.2.2 declares
# `rust-version = "1.98"` and edition 2024. The larry-contracts manifest
# formerly declared 1.85, which was never satisfiable against that
# dependency — the merge corrected a false claim rather than raising a real
# requirement.
rust-version = "1.98"

[workspace.dependencies]
# Estate foundation (crates.io releases; exact pins = controlled deps).
# Capability features are opted into per crate. `default-features = false` is
# stated here rather than per member: cargo ignores a member's
# `default-features` when the workspace declaration omits it, so leaving it
# out would silently keep defaults on. Select only the capabilities used by
# each member; 0.6.6 defaults also include structured tracing.
lgwks_std = { version = "=4.1.2", default-features = false }
# The runtime's owner (larry#68). Defaults off: the clock and skew rows (larry#74) are
# std-only modules, so no member compiles the driver, the ECS world or `script!` until a
# row that needs one turns its feature on. 8.3.1 (larry#189) is the newest release; 8.3.0
# (larry#187) added `RecordJournal::admits` and `RecordProjection::admit` (crates#898,
# #905, #906), which larry#90 builds on.
lgwks_bot = { version = "=8.3.1", default-features = false }
# The dependency-admission storefront. The larry package opts into `appcui` and `sqlite`; the
# published storefront owns that dependency and its transitive admission. 7.2.0 (larry#189)
# is a major release; the ledger's `sqlite::open` and `sqlite::migrate` calls take its API.
lgwks_deps = { version = "=7.2.0", default-features = false }
thiserror = "=2.0.21"  # gap: Logical-Works-Inc/logicalworks-crates#842
# The runtime gate (larry#164): the executor submits every task through it, so
# a task body runs only inside the runtime's authorized owner call.
larry-runtime = { path = "crates/larry-runtime" }

# The stricter of the two former lint sets, applied to the whole workspace.
# A member opts in with `[lints] workspace = true`.
[dependencies]
larry-contracts = { path = "crates/larry-contracts" }
larry-runtime = { workspace = true }
lgwks_std = { workspace = true, features = ["json", "http", "process", "hash", "sign", "pattern"] }
# The runtime gate's clock (larry#164), and `larry serve` (larry#88, ADR 0021):
# the app edge (`edge`) serves the routes, and `signal` stops it on SIGTERM.
# The estate owns HTTP serving, so no Loco here; the crate count and cold build
# are measured in docs/dependencies/cargo-sweep.md.
lgwks_bot = { workspace = true, features = ["edge", "signal"] }
lgwks_deps = { workspace = true, features = ["appcui", "sqlite"] }

[features]
# The local reranker (larry#150): Candle runs the pinned Qwen3 reranker and the Hugging Face
# tokenizer encodes its prompts, both through the lgwks_deps storefront. Off by default, so the
# default build, tests and every CI lane skip the engine; `larry-rerank` requires it.
rerank = ["lgwks_deps/ml-candle", "lgwks_deps/ml-tokenizers"]

[[bin]]
name = "larry-rerank"
path = "src/bin/larry-rerank.rs"
required-features = ["rerank"]

[dev-dependencies]
# Test support only (tests/support/mock_model.rs, larry#82): the estate's BLAKE3
# hasher for the mock endpoint's trace hash. Not a new crate and not in the
# shipped build; the shipped `larry` binary keeps `json` alone.
lgwks_std = { workspace = true, features = ["json", "hash"] }

[lints]
workspace = true

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
improper_ctypes = "forbid"
improper_ctypes_definitions = "forbid"
unsafe_code = "forbid"
unused_must_use = "forbid"

# 66 clippy lints, all `forbid` — a `deny` is defeated by any single
# `#[allow]`; `forbid` cannot be lowered from source (E0453).
[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
assigning_clones = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
borrow_as_ptr = "forbid"
cast_possible_truncation = "forbid"
cast_precision_loss = "forbid"
cast_sign_loss = "forbid"
clone_on_ref_ptr = "forbid"
dbg_macro = "forbid"
empty_drop = "forbid"
exhaustive_enums = "forbid"
exhaustive_structs = "forbid"
exit = "forbid"
expect_fun_call = "forbid"
expect_used = "forbid"
explicit_deref_methods = "forbid"
float_cmp = "forbid"
fn_params_excessive_bools = "forbid"
format_push_string = "forbid"
implicit_clone = "forbid"
integer_division = "forbid"
iter_over_hash_type = "forbid"
large_stack_arrays = "forbid"
let_underscore_future = "forbid"
let_underscore_must_use = "forbid"
lossy_float_literal = "forbid"
manual_contains = "forbid"
map_entry = "forbid"
mem_forget = "forbid"
mem_replace_with_default = "forbid"
min_ident_chars = "forbid"
missing_assert_message = "forbid"
missing_docs_in_private_items = "forbid"
missing_safety_doc = "forbid"
modulo_arithmetic = "forbid"
multiple_unsafe_ops_per_block = "forbid"
must_use_candidate = "forbid"
needless_collect = "forbid"
needless_lifetimes = "forbid"
needless_range_loop = "forbid"
panic = "forbid"
panicking_unwrap = "forbid"
pattern_type_mismatch = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
ptr_arg = "forbid"
rc_buffer = "forbid"
redundant_clone = "forbid"
ref_option_ref = "forbid"
slow_vector_initialization = "forbid"
str_to_string = "forbid"
string_add = "forbid"
todo = "forbid"
transmute_ptr_to_ref = "forbid"
unchecked_time_subtraction = "forbid"
undocumented_unsafe_blocks = "forbid"
unimplemented = "forbid"
unused_io_amount = "forbid"
unwrap_in_result = "forbid"
unwrap_or_default = "forbid"
unwrap_used = "forbid"
wildcard_imports = "forbid"
