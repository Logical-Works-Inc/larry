[package]
name = "rocco-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "rocco"
description = "Effect-free interaction fixtures for the Rocco AppCUI visual pass"

[workspace]
# One repository, one workspace. `crates/rocco-contracts` was previously the
# whole of a second repository (`srinji-kaggss/rocco-runtime`) whose manifest
# declared this same crate set; it is a member here instead. The root package
# is an implicit member.
members = ["crates/rocco-contracts", "crates/rocco-runtime"]
# Edition 2024 selects resolver 3; stated explicitly because the merged
# workspace previously ran under resolver 2 on the runtime side.
resolver = "3"

# Rocco — the specification repository, which also carries the fixture
# implementation and the contract crate it governs. Dependency foundation:
# Rust std + logicalworks-crates releases from crates.io, exact-pinned.
# Every additional third-party edge is registered in contract/APPROVED.toml
# or it does not compile its way into this workspace.

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/srinji-kaggss/Rocco"
# The real floor, and it is the library's: lgwks_std 0.6.6 declares
# `rust-version = "1.98"` and edition 2024. The rocco-contracts manifest
# formerly declared 1.85, which was never satisfiable against that
# dependency — the merge corrects a false claim rather than raising a real
# requirement.
rust-version = "1.98"

[workspace.dependencies]
# Estate foundation (crates.io releases; exact pins = controlled deps).
# Capability features are opted into per crate. `default-features = false` is
# stated here rather than per member: cargo ignores a member's
# `default-features` when the workspace declaration omits it, so leaving it
# out would silently keep defaults on. Select only the capabilities used by
# each member; 0.6.6 defaults also include structured tracing.
lgwks_std = { version = "=0.6.6", default-features = false }
# Catalogued but currently unused by any member: the async runner edge is
# registered for the first crate that needs it, and the register records that
# admission. A catalog entry is not a compile edge.
lgwks_bot = { version = "=0.4.2" }
# The dependency-admission storefront. rocco-demo opts into `appcui`; the
# published storefront owns that dependency and its transitive admission.
lgwks_deps = { version = "=0.1.12", default-features = false }
thiserror = "=2.0.20"

# The stricter of the two former lint sets, applied to the whole workspace.
# A member opts in with `[lints] workspace = true`.
[dependencies]
rocco-contracts = { path = "crates/rocco-contracts" }
lgwks_std = { workspace = true, features = ["json"] }
lgwks_deps = { workspace = true, features = ["appcui"] }

[lints]
workspace = true

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
improper_ctypes = "forbid"
improper_ctypes_definitions = "forbid"
unsafe_code = "forbid"
unused_must_use = "forbid"

# 66 clippy lints, all `forbid` — a `deny` is defeated by any single
# `#[allow]`; `forbid` cannot be lowered from source (E0453).
[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
assigning_clones = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
borrow_as_ptr = "forbid"
cast_possible_truncation = "forbid"
cast_precision_loss = "forbid"
cast_sign_loss = "forbid"
clone_on_ref_ptr = "forbid"
dbg_macro = "forbid"
empty_drop = "forbid"
exhaustive_enums = "forbid"
exhaustive_structs = "forbid"
exit = "forbid"
expect_fun_call = "forbid"
expect_used = "forbid"
explicit_deref_methods = "forbid"
float_cmp = "forbid"
fn_params_excessive_bools = "forbid"
format_push_string = "forbid"
implicit_clone = "forbid"
integer_division = "forbid"
iter_over_hash_type = "forbid"
large_stack_arrays = "forbid"
let_underscore_future = "forbid"
let_underscore_must_use = "forbid"
lossy_float_literal = "forbid"
manual_contains = "forbid"
map_entry = "forbid"
mem_forget = "forbid"
mem_replace_with_default = "forbid"
min_ident_chars = "forbid"
missing_assert_message = "forbid"
missing_docs_in_private_items = "forbid"
missing_safety_doc = "forbid"
modulo_arithmetic = "forbid"
multiple_unsafe_ops_per_block = "forbid"
must_use_candidate = "forbid"
needless_collect = "forbid"
needless_lifetimes = "forbid"
needless_range_loop = "forbid"
panic = "forbid"
panicking_unwrap = "forbid"
pattern_type_mismatch = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
ptr_arg = "forbid"
rc_buffer = "forbid"
redundant_clone = "forbid"
ref_option_ref = "forbid"
slow_vector_initialization = "forbid"
str_to_string = "forbid"
string_add = "forbid"
todo = "forbid"
transmute_ptr_to_ref = "forbid"
unchecked_time_subtraction = "forbid"
undocumented_unsafe_blocks = "forbid"
unimplemented = "forbid"
unused_io_amount = "forbid"
unwrap_in_result = "forbid"
unwrap_or_default = "forbid"
unwrap_used = "forbid"
wildcard_imports = "forbid"
