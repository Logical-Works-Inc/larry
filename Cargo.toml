[package]
name = "larry-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "larry"
description = "Larry, the always-on harness organ of Logic OS: executor, model client and MCP server"

[workspace]
# One repository, one workspace. `crates/larry-contracts` was previously the
# whole of a second repository (`srinji-kaggss/rocco-runtime`) whose manifest
# declared this same crate set; it is a member here instead. The root package
# is an implicit member.
members = ["crates/larry-contracts", "crates/larry-runtime"]
# Edition 2024 selects resolver 3; stated explicitly because the merged
# workspace previously ran under resolver 2 on the runtime side.
resolver = "3"

# Larry — the specification repository, which also carries the implementation
# and the contract crate it governs. Dependency order: Rust std, then the
# lgwks_* estate (exact-pinned crates.io releases), then Loco.rs for the web,
# ORM, jobs, mail and auth gaps the estate does not own, then any other OSS
# crate only with a cited logicalworks-crates `gap` issue. Every third-party
# edge is registered in contract/APPROVED.toml or it does not compile its way
# into this workspace.

[workspace.package]
edition = "2024"
# Hippocratic License 3.0 (HL3-FULL) plus the Licensor's Part B, in /LICENSE.
# Not an SPDX-listed license, hence the LicenseRef; publish = false everywhere.
license = "LicenseRef-Larry-HL3-FULL"
repository = "https://github.com/Logical-Works-Inc/larry"
# The mandated compiler (Director 2026-11-23, larry#406, ADR 0097): every box
# and every job builds with 1.100.0 (`rust-toolchain.toml`), so the floor is
# 1.100 too; `the_toolchain_is_the_mandated_rust` refuses a drift.
rust-version = "1.100"

[workspace.dependencies]
# Estate foundation (crates.io releases; exact pins = controlled deps).
# Capability features are opted into per crate. `default-features = false` is
# stated here rather than per member: cargo ignores a member's
# `default-features` when the workspace declaration omits it, so leaving it
# out would silently keep defaults on. Select only the capabilities used by
# each member.
lgwks_std = { version = "=5.0.0", default-features = false }
# The runtime's owner (larry#68). Defaults off; each member names its features. larry-runtime
# takes `wire`. The larry package takes `edge` (the `lgwks_bot::app` HTTP edge of `larry serve`,
# ADR 0021), which pulls `script` and with it the ECS world, and `signal` for its drain. 10.0.3
# is the newest release; 10.0.2 made one Darwin temp scan per machine (crates#1130); 10.0.0 raised the Landlock allowlist to 4,096 rules (crates#1114), and
# 8.3.0 (larry#187) added `RecordJournal::admits` and `RecordProjection::admit` (crates#898, #905,
# #906), which larry#90 builds on.
lgwks_bot = { version = "=10.0.3", default-features = false }
# The dependency-admission storefront. The larry package opts into `sqlite`; the
# published storefront owns that dependency and its transitive admission. 8.0.0 is the newest
# release and re-exports rusqlite 0.43; 7.2.0 (larry#189) set the ledger's `sqlite::open` and
# `sqlite::migrate` API.
lgwks_deps = { version = "=8.0.0", default-features = false }
# The estate's one Rust reader (larry#293, ADR 0061). The governance temp-path rule parses
# test sources with its tree-sitter grammar and takes its byte, node, depth and time bounds;
# 6.1.1 is the newest release. `lang-rust` selects the Rust grammar and the parser it needs.
lgwks_ast = { version = "=6.1.1", default-features = false }
# The estate's `Error` derive (larry#435): `Display`, `Error` with `source`, and `From` for every
# `#[from]` field, replacing the hand-written impls of every error enum. The crate has no feature
# and is already in the lock through `lgwks_bot`, so this edge adds no crate.
lgwks_macros = { version = "=2.1.4", default-features = false }
# Handle-relative mode reset for the workspace sweep (larry#366): `Dir` holds a descriptor but has no
# call that resets a child's mode from it, so the sweep opens with `openat` and resets through
# `chmodat`/`O_PATH` itself. Already in the lock through `lgwks_std` `fs-raw`, so this adds no crate.
# Estate gap: Logical-Works-Inc/logicalworks-crates#1113; retire this edge when the call lands.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }  # gap: Logical-Works-Inc/logicalworks-crates#1113
# The runtime gate (larry#164): the executor submits every task through it, so
# a task body runs only inside the runtime's authorized owner call.
larry-runtime = { path = "crates/larry-runtime" }

# The stricter of the two former lint sets, applied to the whole workspace.
# A member opts in with `[lints] workspace = true`.
[dependencies]
larry-contracts = { path = "crates/larry-contracts" }
larry-runtime = { workspace = true }
lgwks_std = { workspace = true, features = ["json", "http", "process", "hash", "sign", "pattern", "fs-raw"] }
# `fs-raw` (larry#359) is the estate's handle-relative `fs::capability::Dir`: the governance
# reader opens each governed file with `openat`/`O_NOFOLLOW`/`O_NONBLOCK` from a held descriptor,
# so a link or FIFO swapped in between its check and its open is refused.
# The runtime gate's clock (larry#164), and `larry serve` (larry#88, ADR 0021):
# the app edge (`edge`) serves the routes, and `signal` stops it on SIGTERM.
# The estate owns HTTP serving, so no Loco here; the crate count and cold build
# are measured in docs/dependencies/cargo-sweep.md.
# `process` (larry#243, ADR 0046) is read for `SandboxProfile` and `LandlockRules` only, the estate's
# validation of the confinement a TUI command runs under; the std wrapper and the write-only profile
# the estate lacks are logicalworks-crates#1075.
lgwks_bot = { workspace = true, features = ["edge", "signal", "process"] }
lgwks_deps = { workspace = true, features = ["sqlite"] }
# The one Rust reader of `larry governance`'s temp-path rule (larry#293, ADR 0061): the crate's
# tree-sitter grammar and its `try_parse` bounds replace the deleted hand-written lexer.
lgwks_ast = { workspace = true, features = ["lang-rust"] }
# Every error enum derives `Display`, `Error` and `From` from it (larry#435).
lgwks_macros = { workspace = true }
# The terminal frontend (larry#239, ADR 0045): raw mode, keys, bracketed paste and resize. It was in
# the tree under AppCUI already, so the direct edge adds no crate; AppCUI and its subtree leave.
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"] }  # gap: Logical-Works-Inc/logicalworks-crates#1067
# Display width (UAX #11) for wrapping CJK, emoji and combining marks in the frame; no dependencies.
unicode-width = "=0.2.3"  # gap: Logical-Works-Inc/logicalworks-crates#1067

[target.'cfg(unix)'.dependencies]
# The executor's workspace sweep resets directory modes through held descriptors (larry#366).
rustix = { workspace = true }

[features]
# The local reranker (larry#150): Candle runs the pinned Qwen3 reranker and the Hugging Face
# tokenizer encodes its prompts, both through the lgwks_deps storefront. Off by default, so the
# default build, tests and every CI lane skip the engine; `larry-rerank` requires it.
rerank = ["lgwks_deps/ml-candle", "lgwks_deps/ml-tokenizers"]

[[bin]]
name = "larry-rerank"
path = "src/bin/larry-rerank.rs"
required-features = ["rerank"]

[dev-dependencies]
# Test support only (tests/support/mock_model.rs, larry#82): the estate's BLAKE3
# hasher for the mock endpoint's trace hash. Not a new crate and not in the
# shipped build; the shipped `larry` binary keeps `json` alone.
lgwks_std = { workspace = true, features = ["json", "hash"] }

[target.'cfg(unix)'.dev-dependencies]
# Test support only: the ledger lock test reads the waiter's thread CPU clock (larry#398).
# The same pinned crate as the build; `time` adds no dependency and stays out of `larry`.
rustix = { workspace = true, features = ["time"] }

[lints]
workspace = true

[profile.dev]
debug = 0
incremental = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 0


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
improper_ctypes = "forbid"
improper_ctypes_definitions = "forbid"
unsafe_code = "forbid"
unused_must_use = "forbid"
# The estate's 15-axis lint floor (rust-guard LINT_FLOOR, 2026-11-19), at `deny` so a
# derive or proc macro that emits its own `allow` still compiles.
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"

# 66 clippy lints, all `forbid` — a `deny` is defeated by any single
# `#[allow]`; `forbid` cannot be lowered from source (E0453).
[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
assigning_clones = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
borrow_as_ptr = "forbid"
cast_possible_truncation = "forbid"
cast_precision_loss = "forbid"
cast_sign_loss = "forbid"
clone_on_ref_ptr = "forbid"
dbg_macro = "forbid"
empty_drop = "forbid"
exhaustive_enums = "forbid"
exhaustive_structs = "forbid"
exit = "forbid"
expect_fun_call = "forbid"
expect_used = "forbid"
explicit_deref_methods = "forbid"
float_cmp = "forbid"
fn_params_excessive_bools = "forbid"
format_push_string = "forbid"
implicit_clone = "forbid"
integer_division = "forbid"
iter_over_hash_type = "forbid"
large_stack_arrays = "forbid"
let_underscore_future = "forbid"
let_underscore_must_use = "forbid"
lossy_float_literal = "forbid"
manual_contains = "forbid"
map_entry = "forbid"
mem_forget = "forbid"
mem_replace_with_default = "forbid"
min_ident_chars = "forbid"
missing_assert_message = "forbid"
missing_docs_in_private_items = "forbid"
missing_safety_doc = "forbid"
modulo_arithmetic = "forbid"
multiple_unsafe_ops_per_block = "forbid"
must_use_candidate = "forbid"
needless_collect = "forbid"
needless_lifetimes = "forbid"
needless_range_loop = "forbid"
panic = "forbid"
panicking_unwrap = "forbid"
pattern_type_mismatch = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
ptr_arg = "forbid"
rc_buffer = "forbid"
redundant_clone = "forbid"
ref_option_ref = "forbid"
slow_vector_initialization = "forbid"
str_to_string = "forbid"
string_add = "forbid"
todo = "forbid"
transmute_ptr_to_ref = "forbid"
unchecked_time_subtraction = "forbid"
undocumented_unsafe_blocks = "forbid"
unimplemented = "forbid"
unused_io_amount = "forbid"
unwrap_in_result = "forbid"
unwrap_or_default = "forbid"
unwrap_used = "forbid"
wildcard_imports = "forbid"
# The estate's 15-axis lint floor (rust-guard LINT_FLOOR, 2026-11-19), at `deny` like the
# rust table above.
fallible_impl_from = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
large_futures = "deny"
large_include_file = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
match_wildcard_for_single_variants = "deny"
mod_module_files = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_pass_by_value = "deny"
partial_pub_fields = "deny"
pub_underscore_fields = "deny"
rc_mutex = "deny"
string_slice = "deny"
too_many_lines = "deny"
try_err = "deny"
unnecessary_wraps = "deny"
unreachable = "deny"
unused_async = "deny"
unused_result_ok = "deny"
verbose_file_reads = "deny"
wildcard_dependencies = "deny"
